plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.3.1"
}

import org.gradle.api.attributes.java.TargetJvmVersion

group = 'com.shyamstudio'
version = '1.4.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.helpch.at/releases"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "enginehub"
        url = "https://maven.enginehub.org/repo/"
    }
    maven { name = "jitpack"; url = "https://jitpack.io" }
    maven { name = "codemc"; url = "https://repo.codemc.io/repository/maven-public/" }
}

configurations.all {
    resolutionStrategy {
        // Force compatible versions to resolve conflicts
        force 'com.google.guava:guava:33.3.1-jre'
        force 'com.google.code.gson:gson:2.11.0'
        force 'it.unimi.dsi:fastutil:8.5.15'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")
    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
    
    // Use compatible versions or exclude conflicting transitive dependencies
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.13-SNAPSHOT') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.0-SNAPSHOT') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
    }
    
    compileOnly 'com.github.GriefPrevention:GriefPrevention:17.0.0'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // bStats metrics - relocated into plugin jar to avoid conflicts
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // PVP-toggle persistence (SQLite default, MariaDB opt-in) - relocated into plugin jar
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation('org.mariadb.jdbc:mariadb-java-client:3.5.1') {
        exclude group: 'com.github.waffle', module: 'waffle-jna'
    }

    // Per-online-player PVP state cache - relocated into plugin jar
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Per-viewer PVP status highlight packets - NOT shaded. Server owners must
    // install the PacketEvents plugin themselves (declared as a soft-depend in
    // plugin.yml); this is compile-time only.
    compileOnly 'com.github.retrooper:packetevents-spigot:2.7.0'
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    relocate('org.bstats', "${project.group}.bstats") {
        skipStringConstants = true
    }
    relocate('com.zaxxer.hikari', "${project.group}.libs.hikari")
    relocate('org.sqlite', "${project.group}.libs.sqlite")
    relocate('org.mariadb.jdbc', "${project.group}.libs.mariadb")
    relocate('com.github.benmanes.caffeine', "${project.group}.libs.caffeine")
    dependencies {
        // compileOnly deps (paper-api, WorldGuard, PacketEvents, etc.) are already
        // excluded from runtimeClasspath by Gradle; this just keeps the shaded jar
        // limited to exactly the libraries we intend to bundle.
        exclude {
            it.moduleGroup != 'org.bstats'
                    && it.moduleGroup != 'com.zaxxer'
                    && it.moduleGroup != 'org.xerial'
                    && it.moduleGroup != 'org.mariadb.jdbc'
                    && it.moduleGroup != 'com.github.ben-manes.caffeine'
        }
    }
}

tasks.named('build') {
    dependsOn tasks.shadowJar
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.2")
    }
}

def targetJavaVersion = 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations.configureEach {
    if (canBeResolved && (name == 'compileClasspath' || name == 'annotationProcessorClasspath')) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
